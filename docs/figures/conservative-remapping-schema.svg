<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">First-order conservative cell-average remapping</title>
  <desc id="desc">A conceptual source grid overlaps a target cell. Colored intersection areas contribute source cell averages in proportion to spherical area, preserving the area-integrated scalar on a completely covered domain.</desc>
  <rect width="1000" height="560" fill="#f8fbfd"/>
  <g font-family="Arial,sans-serif" fill="#17324d">
    <text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700">First-order conservative cell-average remapping</text>
    <g transform="translate(70 90)" stroke="#335b73" stroke-width="2">
      <rect width="500" height="360" fill="#ffffff"/>
      <path d="M0 120H500M0 240H500M165 0V360M335 0V360" fill="none"/>
      <rect x="105" y="65" width="300" height="230" fill="#e6a23c" fill-opacity="0.17" stroke="#a45f00" stroke-width="4"/>
      <rect x="105" y="65" width="60" height="55" fill="#4c9f70" fill-opacity="0.55" stroke="none"/>
      <rect x="165" y="65" width="170" height="55" fill="#3b82c4" fill-opacity="0.55" stroke="none"/>
      <rect x="335" y="65" width="70" height="55" fill="#8b5fbf" fill-opacity="0.55" stroke="none"/>
      <rect x="105" y="120" width="60" height="120" fill="#c85c5c" fill-opacity="0.45" stroke="none"/>
      <rect x="165" y="120" width="170" height="120" fill="#2d8f9d" fill-opacity="0.45" stroke="none"/>
      <rect x="335" y="120" width="70" height="120" fill="#6f9d3b" fill-opacity="0.45" stroke="none"/>
      <rect x="105" y="240" width="60" height="55" fill="#be7d3f" fill-opacity="0.45" stroke="none"/>
      <rect x="165" y="240" width="170" height="55" fill="#596fb3" fill-opacity="0.45" stroke="none"/>
      <rect x="335" y="240" width="70" height="55" fill="#9b587c" fill-opacity="0.45" stroke="none"/>
      <text x="250" y="338" text-anchor="middle" stroke="none" font-size="15">source-cell bounds and target overlap</text>
    </g>
    <g transform="translate(620 105)">
      <rect width="320" height="330" rx="12" fill="#ffffff" stroke="#9aabb6" stroke-width="2"/>
      <text x="160" y="42" text-anchor="middle" font-size="18" font-weight="700">Area-weight contract</text>
      <text x="25" y="88" font-size="16">qₜ = Σ Aₜ∩ₛ qₛ / Aₜ</text>
      <text x="25" y="128" font-size="15">• explicit geographic cell bounds</text>
      <text x="25" y="163" font-size="15">• spherical rectangle areas</text>
      <text x="25" y="198" font-size="15">• complete coverage required</text>
      <text x="25" y="233" font-size="15">• constants and integral preserved</text>
      <text x="25" y="268" font-size="15">• no extrapolation or hidden masks</text>
      <text x="25" y="306" font-size="14" fill="#6a3b2e">Cell averages, not nodal vectors</text>
    </g>
    <text x="500" y="515" text-anchor="middle" font-size="15">Conceptual and non-georeferenced; colored regions denote overlap weights, not model output.</text>
  </g>
</svg>
