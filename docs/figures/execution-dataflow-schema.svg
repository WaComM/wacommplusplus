<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">WaComM++ normalized data and execution hierarchy</title>
  <desc id="desc">Conceptual flow from ocean, weather, and wave products through validating adapters and a shared normalized field contract into MPI or FlexMPI decomposition, OpenMP particle work, optional CUDA execution, and one particle solver.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:2}.contract{fill:#dbeafe;stroke:#1d4ed8;stroke-width:2}.solver{fill:#dcfce7;stroke:#15803d;stroke-width:2}.label{font:16px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.small{font:13px system-ui,sans-serif;fill:#334155;text-anchor:middle}.line{stroke:#2563eb;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      @media (prefers-color-scheme:dark){.box{fill:#1e293b;stroke:#cbd5e1}.contract{fill:#172554;stroke:#60a5fa}.solver{fill:#14532d;stroke:#4ade80}.label{fill:#f8fafc}.small{fill:#cbd5e1}}
    </style>
  </defs>
  <rect class="box" x="35" y="40" width="150" height="62" rx="8"/><text class="label" x="110" y="67">Ocean products</text><text class="small" x="110" y="88">ROMS · NEMO · HYCOM</text>
  <rect class="box" x="35" y="178" width="150" height="62" rx="8"/><text class="label" x="110" y="205">Weather products</text><text class="small" x="110" y="226">WRF</text>
  <rect class="box" x="35" y="316" width="150" height="62" rx="8"/><text class="label" x="110" y="343">Wave products</text><text class="small" x="110" y="364">WW3</text>
  <rect class="box" x="255" y="135" width="175" height="145" rx="8"/><text class="label" x="342" y="169">Validating adapters</text><text class="small" x="342" y="197">identity · dimensions · units</text><text class="small" x="342" y="219">calendar · coordinates</text><text class="small" x="342" y="241">finite range · vector basis</text><text class="small" x="342" y="263">optional explicit regridding</text>
  <rect class="contract" x="500" y="135" width="175" height="145" rx="8"/><text class="label" x="587" y="169">Normalized contract</text><text class="small" x="587" y="197">physical time</text><text class="small" x="587" y="219">Earth-relative m s⁻¹</text><text class="small" x="587" y="241">contiguous arrays</text><text class="small" x="587" y="263">shared grid metadata</text>
  <rect class="box" x="745" y="35" width="180" height="62" rx="8"/><text class="label" x="835" y="62">MPI / FlexMPI</text><text class="small" x="835" y="83">particle ownership</text>
  <rect class="box" x="745" y="130" width="180" height="62" rx="8"/><text class="label" x="835" y="157">OpenMP</text><text class="small" x="835" y="178">shared-memory schedule</text>
  <rect class="box" x="745" y="225" width="180" height="62" rx="8"/><text class="label" x="835" y="252">Optional CUDA</text><text class="small" x="835" y="273">accelerator placement</text>
  <rect class="solver" x="745" y="320" width="180" height="70" rx="8"/><text class="label" x="835" y="349">One particle model</text><text class="small" x="835" y="372">same equations and policy</text>
  <path class="line" d="M185 71 C220 71 220 165 255 165"/><path class="line" d="M185 209 L255 209"/><path class="line" d="M185 347 C220 347 220 251 255 251"/>
  <path class="line" d="M430 208 L500 208"/><path class="line" d="M675 208 C710 208 710 66 745 66"/><path class="line" d="M835 97 L835 130"/><path class="line" d="M835 192 L835 225"/><path class="line" d="M835 287 L835 320"/>
</svg>
