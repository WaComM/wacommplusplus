<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title description">
 <title id="title">Explicit projected environmental regridding pipeline</title>
 <desc id="description">Ocean longitude and latitude in EPSG 4326 pass through a declared PROJ coordinate transformation into source x and y coordinates before rectilinear bilinear interpolation of Earth-relative vectors.</desc>
 <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#2563eb"/></marker></defs>
 <rect width="960" height="380" fill="#f8fafc"/><g font-family="sans-serif" fill="#172033" stroke="#334155" stroke-width="2">
 <rect x="35" y="100" width="220" height="105" rx="10" fill="#dbeafe"/><text x="145" y="137" text-anchor="middle" stroke="none" font-size="18">Ocean target</text><text x="145" y="171" text-anchor="middle" stroke="none" font-size="16">longitude, latitude</text><text x="145" y="194" text-anchor="middle" stroke="none" font-size="14">EPSG:4326, degrees</text>
 <path d="M255 152H355" marker-end="url(#a)"/><rect x="365" y="75" width="230" height="155" rx="10" fill="#fef3c7"/><text x="480" y="112" text-anchor="middle" stroke="none" font-size="18">Declared CRS transform</text><text x="480" y="145" text-anchor="middle" stroke="none" font-size="15">PROJ: EPSG:4326 → source_crs</text><text x="480" y="177" text-anchor="middle" stroke="none" font-size="14">never inferred</text><text x="480" y="205" text-anchor="middle" stroke="none" font-size="14">coordinates only</text>
 <path d="M595 152H695" marker-end="url(#a)"/><rect x="705" y="100" width="220" height="105" rx="10" fill="#dcfce7"/><text x="815" y="137" text-anchor="middle" stroke="none" font-size="18">Source grid sampling</text><text x="815" y="169" text-anchor="middle" stroke="none" font-size="15">bilinear in x, y</text><text x="815" y="194" text-anchor="middle" stroke="none" font-size="14">Earth-relative vectors</text>
 <text x="480" y="305" text-anchor="middle" stroke="none" font-size="16">Optional preprocessing; no extrapolation, vector rotation, or conservative remapping</text><text x="480" y="337" text-anchor="middle" stroke="none" font-size="14">Conceptual coordinate pipeline, not a map or model result</text></g>
</svg>
