<title>Sarno OpenMP efficiency and MPI comparison</title>
<desc>Measured OpenMP solver and application efficiency at 1, 2, 4, 8, 16, 32 threads with one MPI process; historical MPI solver reference at matching core counts through 32. Logarithmic axes. Each sweep uses its own one-core baseline; single observations, no confidence intervals.</desc>
