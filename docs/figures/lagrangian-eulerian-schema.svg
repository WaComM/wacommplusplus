<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Eulerian forcing and Lagrangian particle sampling</title><desc id="desc">Conceptual non-georeferenced grid with fixed forcing nodes, an off-grid particle, interpolation weights, and a trajectory arrow.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#d97706"/></marker></defs><rect width="900" height="390" rx="18" fill="#f8fafc" stroke="#64748b"/>
  <g stroke="#64748b" stroke-width="2"><path d="M70 65H510M70 145H510M70 225H510M70 305H510"/><path d="M70 65V305M180 65V305M290 65V305M400 65V305M510 65V305"/></g><g fill="#2563eb"><circle cx="290" cy="145" r="6"/><circle cx="400" cy="145" r="6"/><circle cx="290" cy="225" r="6"/><circle cx="400" cy="225" r="6"/></g><rect x="290" y="145" width="110" height="80" fill="#bfdbfe" fill-opacity=".35" stroke="#2563eb" stroke-dasharray="6 4"/><circle cx="355" cy="194" r="11" fill="#d97706"/><path d="M355 194C430 180 490 130 555 100" fill="none" stroke="#d97706" stroke-width="5" marker-end="url(#a)"/>
  <g font-family="sans-serif" fill="#0f172a"><text x="70" y="40" font-size="22" font-weight="bold">Fixed Eulerian grid</text><text x="308" y="255" font-size="17">four nodal weights</text><text x="330" y="188" font-size="16">particle</text><text x="570" y="104" font-size="20" font-weight="bold">Lagrangian path</text><text x="570" y="136" font-size="16">sample field at particle</text><text x="570" y="160" font-size="16">advance fractional indices</text><text x="70" y="350" font-size="15">Conceptual and not georeferenced; cell distortion and vertical levels omitted.</text></g>
