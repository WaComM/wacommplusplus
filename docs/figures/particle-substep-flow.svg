<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" role="img" aria-labelledby="title desc"><title id="title">WaComM++ particle substep</title><desc id="desc">Conceptual flow from active-state and cell validation through interpolation, velocity composition, displacement, closure, and state update.</desc><defs><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs><rect width="980" height="300" rx="18" fill="#f8fafc" stroke="#64748b"/><g font-family="sans-serif" font-size="15" text-anchor="middle" fill="#0f172a"><g fill="#dbeafe" stroke="#2563eb"><rect x="25" y="95" width="130" height="70" rx="10"/><rect x="185" y="95" width="130" height="70" rx="10"/><rect x="345" y="95" width="130" height="70" rx="10"/><rect x="505" y="95" width="130" height="70" rx="10"/><rect x="665" y="95" width="130" height="70" rx="10"/><rect x="825" y="95" width="130" height="70" rx="10"/></g><text x="90" y="122"><tspan x="90">check release,</tspan><tspan x="90" dy="20">health, cell</tspan></text><text x="250" y="122"><tspan x="250">sample fields</tspan><tspan x="250" dy="20">at midpoint</tspan></text><text x="410" y="122"><tspan x="410">compose current,</tspan><tspan x="410" dy="20">leeway, waves</tspan></text><text x="570" y="122"><tspan x="570">add keyed</tspan><tspan x="570" dy="20">displacement</tspan></text><text x="730" y="122"><tspan x="730">map metres and</tspan><tspan x="730" dy="20">apply closures</tspan></text><text x="890" y="122"><tspan x="890">update age,</tspan><tspan x="890" dy="20">health, side</tspan></text></g><g stroke="#475569" stroke-width="3" marker-end="url(#b)"><path d="M155 130H181"/><path d="M315 130H341"/><path d="M475 130H501"/><path d="M635 130H661"/><path d="M795 130H821"/></g><g font-family="sans-serif" fill="#0f172a"><text x="25" y="45" font-size="22" font-weight="bold">One completed substep Δt</text><text x="25" y="225" font-size="16">A closure may constrain, reflect, or terminate the particle. Random terms are keyed by physical interval, identity, and substep.</text><text x="25" y="255" font-size="15">Conceptual numerical schema; not a model result.</text></g></svg>
