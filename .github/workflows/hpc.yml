name: HPC and architecture validation

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

jobs:
  cuda-compile:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.3-devel-ubuntu24.04
    steps:
      - run: apt-get update && apt-get install -y ca-certificates git
      - uses: actions/checkout@v5
      - name: Install application dependencies
        run: >-
          apt-get install -y cmake g++ pkg-config libnetcdf-dev
          libnetcdf-c++4-dev liblog4cplus-dev nlohmann-json3-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUSE_CUDA=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  riscv64-qemu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64
      - name: Build and test on Debian Trixie riscv64
        run: >-
          docker run --rm --platform linux/riscv64
          -v "$PWD:/workspace" -w /workspace
          riscv64/debian:trixie-slim
          sh -c 'apt-get update && apt-get install -y cmake g++ &&
          cmake -S . -B build-riscv64-qemu -DBUILD_APPLICATION=OFF &&
          cmake --build build-riscv64-qemu --parallel 2 &&
          ctest --test-dir build-riscv64-qemu --output-on-failure'
