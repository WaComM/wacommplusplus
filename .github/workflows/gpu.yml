name: GPU numerical validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cuda-runtime-parity:
    runs-on: [self-hosted, linux, x64, gpu, cuda]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Configure CUDA application
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUSE_CUDA=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build -R cuda_particle_parity --output-on-failure
