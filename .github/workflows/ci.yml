name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-core:
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S . -B build -DBUILD_APPLICATION=OFF
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure

  ubuntu-application:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - name: serial
            cmake_options: ''
          - name: openmp
            cmake_options: -DUSE_OMP=ON
          - name: mpi
            cmake_options: -DUSE_MPI=ON
          - name: mpi-openmp
            cmake_options: -DUSE_MPI=ON -DUSE_OMP=ON
    name: Ubuntu application (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update
      - name: Install application dependencies
        run: >-
          sudo apt-get install -y libnetcdf-dev libnetcdf-c++4-dev
          liblog4cplus-dev nlohmann-json3-dev pkg-config
          libopenmpi-dev openmpi-bin
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_options }}
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - run: cmake --install build --prefix install
      - name: Installed executable smoke check
        run: test -x install/bin/wacommplusplus && ldd install/bin/wacommplusplus

  rocky-8-9:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: rockylinux:8.9
    steps:
      - name: Pin Rocky Linux 8.9 vault repositories
        run: |
          sed -i 's|^mirrorlist=|#mirrorlist=|' /etc/yum.repos.d/Rocky-*.repo
          sed -i 's|^#baseurl=http://dl.rockylinux.org/\$contentdir/\$releasever|baseurl=https://dl.rockylinux.org/vault/rocky/8.9|' /etc/yum.repos.d/Rocky-*.repo
      - name: Enable archived EPEL and PowerTools repositories
        run: |
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled powertools
          sed -i 's|^mirrorlist=|#mirrorlist=|' /etc/yum.repos.d/epel*.repo
          sed -i 's|^#baseurl=https://download.example/pub/epel|baseurl=https://archives.fedoraproject.org/pub/archive/epel|' /etc/yum.repos.d/epel*.repo
      - name: Install application dependencies
        run: >-
          dnf install -y ca-certificates git gcc-c++ cmake pkgconf-pkg-config
          netcdf-devel netcdf-cxx4-devel log4cplus-devel
      - name: Install pinned nlohmann JSON headers
        run: |
          git clone --branch v3.11.3 --depth 1 https://github.com/nlohmann/json.git /tmp/json
          test "$(git -C /tmp/json rev-parse HEAD)" = 9cca280a4d0ccf0c08f47a99aa71d1b0e52f8d03
          cmake -S /tmp/json -B /tmp/json-build -DJSON_BuildTests=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --install /tmp/json-build
      - uses: actions/checkout@v5
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - run: cmake --install build --prefix install
      - name: Installed executable smoke check
        run: |
          test -x install/bin/wacommplusplus
          ldd install/bin/wacommplusplus
          ! ldd install/bin/wacommplusplus | grep 'not found'

  raspberry-pi-os-proxy:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    container: debian:bookworm
    steps:
      - run: apt-get update && apt-get install -y ca-certificates git cmake g++
      - uses: actions/checkout@v5
      - run: cmake -S . -B build -DBUILD_APPLICATION=OFF
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  riscv64-cross-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update
      - run: sudo apt-get install -y g++-riscv64-linux-gnu
      - run: >-
          cmake -S . -B build-riscv64 -DBUILD_APPLICATION=OFF
          -DCMAKE_SYSTEM_NAME=Linux
          -DCMAKE_SYSTEM_PROCESSOR=riscv64
          -DCMAKE_CXX_COMPILER=riscv64-linux-gnu-g++
      - run: cmake --build build-riscv64
