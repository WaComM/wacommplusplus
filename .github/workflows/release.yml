name: Release source

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The complete CI matrix, including the MPI, parallel-I/O, Rocky, Windows,
  # and macOS builds, must pass at the tagged revision before publication.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  openacc-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update
      - run: >-
          sudo apt-get install -y libnetcdf-dev libnetcdf-c++4-dev
          liblog4cplus-dev nlohmann-json3-dev pkg-config
      - run: cmake -S . -B build-openacc -DCMAKE_BUILD_TYPE=Release -DUSE_OPENACC=ON
      - run: cmake --build build-openacc --parallel
      - run: ctest --test-dir build-openacc --output-on-failure

  cuda-compile-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: nvidia/cuda:12.6.3-devel-ubuntu24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - run: apt-get update && apt-get install -y ca-certificates git
      - uses: actions/checkout@v5
      - run: >-
          apt-get install -y cmake g++ pkg-config libnetcdf-dev
          libnetcdf-c++4-dev liblog4cplus-dev nlohmann-json3-dev
      - run: cmake -S . -B build-cuda -DCMAKE_BUILD_TYPE=Release -DUSE_CUDA=ON
      - run: cmake --build build-cuda --parallel
      - run: ctest --test-dir build-cuda --output-on-failure

  source-archive:
    needs: [ci, openacc-validation, cuda-compile-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update
      - name: Install application dependencies
        run: >-
          sudo apt-get install -y libnetcdf-dev libnetcdf-c++4-dev
          liblog4cplus-dev nlohmann-json3-dev pkg-config
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - run: cmake --install build --prefix install
      - run: test -x install/bin/wacommplusplus && ldd install/bin/wacommplusplus
      - name: Create deterministic source archive
        run: |
          name="wacommplusplus-${GITHUB_REF_NAME}"
          git archive --format=tar --prefix="${name}/" HEAD > "${name}.tar"
          gzip -n -9 "${name}.tar"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
      - name: Record release build metadata
        # Reproducibility metadata of the validated release build (docs/reproducibility.md)
        run: |
          name="wacommplusplus-${GITHUB_REF_NAME}"
          {
            echo "tag: ${GITHUB_REF_NAME}"
            echo "git_revision: $(git rev-parse HEAD)"
            echo "workflow_run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "runner: ${RUNNER_OS} ${RUNNER_ARCH} $(lsb_release -ds)"
            echo "compiler: $(c++ --version | head -1)"
            echo "cmake: $(cmake --version | head -1)"
            echo "cmake_options: -DCMAKE_BUILD_TYPE=Release"
            echo "netcdf: $(nc-config --version)"
            echo "log4cplus: $(dpkg-query -W -f='${Version}' liblog4cplus-dev)"
            echo "nlohmann_json: $(dpkg-query -W -f='${Version}' nlohmann-json3-dev)"
            echo "source_sha256: $(cut -d' ' -f1 "${name}.tar.gz.sha256")"
            echo "installed_executable_sha256: $(sha256sum install/bin/wacommplusplus | cut -d' ' -f1)"
          } > "${name}-build-metadata.txt"
          ctest --test-dir build -N > "${name}-tests.txt"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            wacommplusplus-${{ github.ref_name }}.tar.gz
            wacommplusplus-${{ github.ref_name }}.tar.gz.sha256
            wacommplusplus-${{ github.ref_name }}-build-metadata.txt
            wacommplusplus-${{ github.ref_name }}-tests.txt
          generate_release_notes: true
