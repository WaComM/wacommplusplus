name: FlexMPI validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flexmpi-runtime:
    runs-on: [self-hosted, linux, x64, flexmpi]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Configure FlexMPI application
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUSE_EMPI=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
